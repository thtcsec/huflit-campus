services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    # On ARM / constrained hosts, prefer:
    # image: mcr.microsoft.com/azure-sql-edge
    container_name: huflit-campus-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Huflit_Campus_Dev_Strong_Passw0rd!"
    ports:
      - "1433:1433"
    volumes:
      - huflit_sql_data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"Huflit_Campus_Dev_Strong_Passw0rd!\" -C -Q \"SELECT 1\" || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"Huflit_Campus_Dev_Strong_Passw0rd!\" -Q \"SELECT 1\" || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: src/backend/Dockerfile
    image: huflit-campus-api
    container_name: huflit-campus-api
    depends_on:
      sqlserver:
        condition: service_healthy
    ports:
      - "5080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=HuflitCampus;User Id=sa;Password=Huflit_Campus_Dev_Strong_Passw0rd!;TrustServerCertificate=True;MultipleActiveResultSets=true"
      Jwt__SecretKey: "HUFLIT_CAMPUS_DOCKER_DEV_SIGNING_KEY_32+"
      Jwt__Key: "HUFLIT_CAMPUS_DOCKER_DEV_SIGNING_KEY_32+"
      Jwt__Issuer: HuflitCampus
      Jwt__Audience: HuflitCampus
      Cors__Origins__0: http://localhost:5173
      Cors__Origins__1: http://127.0.0.1:5173
      BlobStorage__Provider: Local
      BlobStorage__LocalRootPath: wwwroot/uploads
      BlobStorage__PublicBaseUrl: http://localhost:5080/uploads
      AzureBlob__LocalRootPath: wwwroot/uploads
      AzureBlob__PublicBaseUrl: http://localhost:5080/uploads
    volumes:
      - huflit_uploads:/app/wwwroot/uploads

  frontend:
    build:
      context: .
      dockerfile: src/frontend/Dockerfile
    image: huflit-campus-frontend
    container_name: huflit-campus-frontend
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  huflit_sql_data:
  huflit_uploads:
